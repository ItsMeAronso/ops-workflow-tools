<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ops Tool - Smart AWB Router</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 450px; width: 100%; }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; margin-bottom: 25px; font-size: 14px; }
        input { width: 90%; padding: 12px; margin-bottom: 20px; border: 1px solid #bdc3c7; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        button { background: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 90%; transition: background 0.3s; font-weight: bold; }
        button:hover { background: #2980b9; }
        #result { margin-top: 25px; font-size: 15px; padding: 15px; border-radius: 6px; display: none; text-align: left; }
        .success { background-color: #e8f8f5; border: 1px solid #a3e4d7; color: #117a65; }
        .error { background-color: #fdedec; border: 1px solid #f5b7b1; color: #c0392b; }
        a { color: #3498db; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 10px; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Smart AWB Router</h2>
        <p>Internal Operations Tool for Automated Carrier Detection</p>
        
        <input type="text" id="trackNum" placeholder="Paste Tracking Number (AWB) here">
        <button onclick="findCarrier()">Generate Tracking Link</button>
        
        <div id="result"></div>
    </div>

    <script>
        function findCarrier() {
            const trackingNumber = document.getElementById('trackNum').value.trim().toUpperCase();
            const resultDiv = document.getElementById('result');
            
            if(!trackingNumber) { 
                showResult("Please enter a tracking number.", false);
                return; 
            }

            // Updated list of carriers including The Courier Guy
            const carriers = [
                { name: "UPS", pattern: /^1Z[0-9A-Z]{16}$/, url: "https://www.ups.com/track?tracknum=" },
                { name: "FedEx", pattern: /^[0-9]{12,15}$/, url: "https://www.fedex.com/fedextrack/?trknbr=" },
                { name: "DHL", pattern: /^[0-9]{10}$/, url: "https://www.dhl.com/en/express/tracking.html?AWB=" },
                { name: "The Courier Guy", pattern: /^[0-9]{11}$/, url: "https://portal.thecourierguy.co.za/track?ref=" }
            ];

            // Loop to check if the AWB matches any known carrier pattern
            for(let carrier of carriers) {
                if(carrier.pattern.test(trackingNumber)) {
                    const fullUrl = carrier.url + trackingNumber;
                    const htmlContent = `✅ <strong>Carrier Identified:</strong> ${carrier.name}<br>
                                         🔗 <a href="${fullUrl}" target="_blank">Click here to track shipment</a>`;
                    showResult(htmlContent, true);
                    return;
                }
            }
            
            // Fallback mechanism: Google Search for unknown formats
            const googleSearchUrl = `https://www.google.com/search?q=track+${trackingNumber}`;
            const fallbackContent = `⚠️ <strong>Carrier format not in local database.</strong><br>
                                     🔍 <a href="${googleSearchUrl}" target="_blank">Search this AWB on Google</a>`;
            showResult(fallbackContent, false); // False gives it the red background
        }

        // UI rendering function
        function showResult(message, isSuccess) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = message;
            resultDiv.className = isSuccess ? 'success' : 'error';
        }
    </script>

</body>
</html>
